name: Python syntax check

on:
  push:
    branches: [fix/stream-errors-propagation]
  pull_request:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile Python modules
        run: python -m compileall -q .
